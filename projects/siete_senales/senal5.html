Item(S, Img('thumbs_heart', 520), { x: 480, y: 560 });
Item(S, Chip('¿TE ESTÁ SIRVIENDO? DALE ME GUSTA', { fill: K.yellow, size: 44 }), { x: 1260, y: 380, t: 'like', enter: 'slam' });

Run(T('s5'), T('s6'));
