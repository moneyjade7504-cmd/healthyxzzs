<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}svg{display:block}text{font-family:Inter,sans-serif}</style>
<script src="../../.claude/skills/health-video/flat/lib.js"></script>
<script src="../../.claude/skills/health-video/flat/kit.js"></script>
<script src="cues.js"></script>
</head><body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
<script src="common.js"></script>
<script>
// PARTE 1 · SEÑAL 1: analizas a fondo (+ rumination)
let S;

// P · section title (the voice reads it)
S = Scene('parte1', 'hay');
Item(S, Kicker('PARTE 1', 'TU CEREBRO PERCIBE\nLO QUE OTROS PASAN POR ALTO', { size: 74 }), { x: 960, y: 300, t: 'parte1', enter: 'u' });
Item(S, Img('m_magnifier', 400), { x: 960, y: 800, t: 'percibe', bob: 5 });

// Q · some move on / you replay
S = Scene('hay', 'noporque');
el('line', { x1: 960, y1: 120, x2: 960, y2: 960, stroke: K.grey, 'stroke-width': 6, 'stroke-dasharray': '6 18', 'stroke-linecap': 'round' }, S.g);
Item(S, Img('m_walk_thumb', 430), { x: 470, y: 500, t: 'hay', enter: 'l', bob: 5 });
Item(S, Chip('SIGUEN ADELANTE', { icon: 'check', color: K.green }), { x: 470, y: 860, t: 'hay+1.6' });
Item(S, Img('replay', 480), { x: 1340, y: 500, t: 'tu1', enter: 'r', bob: 5 });
Item(S, Img('bubble', 130), { x: 1700, y: 250, t: 'frase' });
Item(S, Img('eye', 90), { x: 1720, y: 450, t: 'mirada' });
Item(S, Ico('bubble', 1.2), { x: 1710, y: 640, t: 'silencio' });
Item(S, Chip('TÚ LO REPASAS', { icon: 'question', color: K.yellow }), { x: 1340, y: 860, t: 'tu1+1.2' });

// R · attention stops on details
S = Scene('noporque', 'imagina');
Item(S, Img('magnifier', 560), { x: 600, y: 520, bob: 6 });
Item(S, Img('clock', 140), { x: 1280, y: 300, t: 'noporque+0.4', rot: -6 });
Item(S, Img('eye', 130), { x: 1500, y: 500, t: 'noporque+0.8' });
Item(S, Img('bubble', 140), { x: 1270, y: 700, t: 'noporque+1.2', rot: 5 });
Item(S, Ring(110), { x: 1500, y: 500, t: 'detenerse' });
Item(S, Pill('SE DETIENE EN LOS DETALLES', { hi: 'DETALLES' }), { y: 975, t: 'detenerse', enter: 'd' });
punchAt(S, 'detenerse');

// S · "Estoy bien"
S = Scene('imagina', 'signo1');
Item(S, Panel('s_bench', 1150), { x: 680, y: 470, zoom: 0.05 });
Item(S, Pill('«ESTOY BIEN»', { fill: '#fff', color: K.ink, size: 60, stroke: K.ink }), { x: 1000, y: 105, t: 'estoybien' });
Item(S, Ring(105), { x: 885, y: 400, t: 'despacio' });
Item(S, Chip('HABLA DESPACIO', { size: 48 }), { x: 1560, y: 300, t: 'despacio', enter: 'r', out: 'aceptan' });
Item(S, Chip('EVITA MIRARTE', { size: 48 }), { x: 1560, y: 470, t: 'evita', enter: 'r', out: 'aceptan' });
Item(S, Chip('SONRÍE MENOS', { size: 48 }), { x: 1560, y: 640, t: 'sonrie', enter: 'r', out: 'aceptan' });
Item(S, Ico('question', 1.6), { x: 1560, y: 470, t: 'preguntarte-0.5' });
Item(S, Pill('¿REALMENTE ESTÁ BIEN?', { hi: 'REALMENTE' }), { y: 985, t: 'preguntarte', enter: 'd' });

// T · SEÑAL 1
S = Scene('signo1', 'registra');
Item(S, Img('magnifier', 580), { x: 440, y: 540, t: 'signo1', enter: 'l', bob: 6 });
Item(S, Kicker('SEÑAL 1', 'ANALIZAS\nA FONDO', { size: 120 }), { x: 1250, y: 470, t: 'signo1', enter: 'slam' });
Item(S, Pill('LO COTIDIANO, CON LUPA', { hi: 'CON LUPA' }), { x: 1250, y: 880, t: 'analizar+1', enter: 'd' });
punchAt(S, 'analizar');

// U · the brain selects (funnel)
S = Scene('registra', 'senales');
Item(S, g => {
  const dots = [];
  for (let i = 0; i < 18; i++) dots.push(el('circle', { r: 16, fill: [K.pink, K.blue, K.yellow][i % 3], stroke: K.ink, 'stroke-width': 5 }, g));
  el('image', { href: SRC('funnel'), x: -170, y: -60, width: 340, height: 256 }, g);
  return { draw(t) {
    dots.forEach((d, i) => {
      const u = ((t / 2.6) + i / 18) % 1, pass = i % 5 === 0;
      const x0 = ((i * 137) % 360) - 180;
      let x, y, o = 1;
      if (u < 0.45) { x = x0; y = -330 + u / 0.45 * 290; }
      else if (!pass) { const v = (u - 0.45) / 0.55; x = x0 + Math.sign(x0 || 1) * v * 260; y = -40 - Math.sin(v * Math.PI) * 60 + v * 80; o = 1 - v; }
      else { const v = (u - 0.45) / 0.55; x = lerp(x0, 0, Math.min(1, v * 2)); y = -40 + v * 380; o = v > 0.85 ? (1 - v) / 0.15 : 1; }
      set(d, { cx: x.toFixed(1), cy: y.toFixed(1), opacity: clamp(o).toFixed(2) });
    });
  } };
}, { x: 960, y: 470, t: 'registra', enter: 'fade' });
Item(S, Img('brain', 190), { x: 960, y: 900, t: 'selecciona', bob: 4 });
Item(S, Chip('EXPERIENCIAS', { color: K.blueD }), { x: 380, y: 360, t: 'experiencias', enter: 'l' });
Item(S, Chip('EXPECTATIVAS', { color: K.blueD }), { x: 380, y: 560, t: 'expectativas', enter: 'l' });
Item(S, Chip('LO IMPORTANTE', { color: K.blueD }), { x: 380, y: 760, t: 'importante', enter: 'l' });
Item(S, Txt('NO TODO\nENTRA IGUAL', { size: 64 }), { x: 1530, y: 470, t: 'registra+0.6', enter: 'r' });

// V · social signals → nuances
S = Scene('senales', 'sinembargo');
Item(S, Img('think', 560), { x: 470, y: 530, bob: 6 });
Item(S, Ico('bubble', 1.3), { x: 760, y: 210, t: 'senales+0.4' });
Item(S, Ico('question', 1.1), { x: 860, y: 340, t: 'explicaciones' });
Item(S, Chip('MATICES', { icon: 'check', color: K.green }), { x: 1360, y: 320, t: 'matices', enter: 'r' });
Item(S, Chip('PUNTOS DE VISTA', { icon: 'check', color: K.green }), { x: 1360, y: 520, t: 'puntos', enter: 'r' });
Item(S, Chip('DECISIONES REFLEXIVAS', { icon: 'check', color: K.green }), { x: 1360, y: 720, t: 'decisiones', enter: 'r' });

// W · observe vs get trapped (rumination)
S = Scene('sinembargo', 'signo2');
el('rect', { x: 60, y: 140, width: 880, height: 900, rx: 40, fill: K.greenL }, S.g);
el('rect', { x: 980, y: 140, width: 880, height: 900, rx: 40, fill: K.redL }, S.g);
Item(S, Txt('OBSERVAR', { size: 76, color: K.green }), { x: 500, y: 225, t: 'sinembargo+0.4', enter: 'u' });
Item(S, Txt('ATRAPARSE', { size: 76, color: K.red }), { x: 1420, y: 225, t: 'atrapado', enter: 'u' });
Item(S, Img('replay', 440), { x: 380, y: 540, t: 'repasas', bob: 5 });
Item(S, Arrow(300, 0, { color: K.green }), { x: 580, y: 560, t: 'sigues' });
Item(S, Chip('ÚTIL', { icon: 'check', color: K.green }), { x: 500, y: 890, t: 'util' });
Item(S, Img('stressed', 460), { x: 1330, y: 560, t: 'vuelves', bob: 3 });
Item(S, Loop({ r: 80, color: K.red, width: 18, speed: 0.6 }), { x: 1680, y: 420, t: 'vuelves+0.5' });
Item(S, Chip('RUMIACIÓN', { icon: 'cross', color: K.red }), { x: 1420, y: 890, t: 'rumiacion', enter: 'slam' });
Item(S, StampB('+ MALESTAR', { size: 58 }), { x: 1660, y: 680, t: 'malestar', enter: 'slam' });
punchAt(S, 'rumiacion');

Strip('signo1', 'signo2+1', t => 1);
Run(T('parte1'), T('signo2'));
</script></body></html>
