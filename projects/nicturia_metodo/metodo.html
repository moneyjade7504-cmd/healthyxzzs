{const B=beats[beats.length-1]; Cap(B,'cada parte responde a uno de los 3 cambios',{cx:960,cy:860,size:46,t0:C('cada3'),pill:true});}

{const B=Beat(C('p1'),C('primera'),{enter:'zoom'}); PasoT(B,1,'Empiece <span class="hl">fuerte por la mañana</span>',B.a);

{const B=Beat(C('p4'),C('estudio19'),{enter:'zoom'}); PasoT(B,4,'El cambio del <span class="hl">sodio</span>',B.a);

{const B=Beat(C('estudio19'),C('cena630'));
 const s=Svg(B); Draw(B,s,'M560 820 H1360',{t0:B.a+0.3,dur:0.3,stroke:'#3a3c52',w:6});

 Cap(B,'aunque beba poco por la noche',{cx:960,cy:90,size:46,t0:C('porEso'),pill:true});}
{const B=FB(C('traslade'),C('cena'),'S3_7','Lo más salado, <span class="hl">al almuerzo</span>',{capT:0.3,size:60});
