<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="cues.js"></script><script src="common.js"></script>
<script>
window.START=C('v1'); window.END=C('verdad2'); window.DURATION=window.END;
const PW=1560;
// body silhouette helper: map original-image point → screen
const BODY={cx:760,cy:1000,h:760}; const bs=BODY.h/455, bl=BODY.cx-361*bs/2, bt=BODY.cy-BODY.h;
const bp=(x,y)=>[bl+x*bs, bt+y*bs];

// 0 · section title
{const B=Beat(C('v1'),C('nadie'),{enter:'zoom'});
 Num(B,1,{cx:960,cy:260,r:110,t0:B.a+0.1});
 Cap(B,'VERDAD 1',{cx:960,cy:450,size:70,t0:B.a+0.4,color:'#2f6fd6'});
 Cap(B,'Ducharse <span class="hl">todos los días</span>',{cx:960,cy:600,size:100,t0:B.a+1.0});
 Cap(B,'no siempre es lo mejor después de los 60',{cx:960,cy:730,size:60,t0:B.a+2.2});
 Cut(B,'shower_head',{cx:1720,cy:1060,h:300,t0:B.a+1.5,amp:6}); Cut(B,'calendar',{cx:200,cy:1060,h:260,t0:B.a+1.8,amp:4});}

// 1 · costumbre: levantarse y entrar en la ducha
{const B=Beat(C('nadie'),C('lavamos')); const p=Panel(B,'s_dawn',{from:[.25,.5,1.0],to:[.65,.55,1.14]});
 p.draw=(c,t)=>rays(c,t,{x:140,y:120});
 Cap(B,'Una costumbre que <span class="hl">nadie cuestiona</span>',{cx:960,cy:965,size:72,t0:B.a+0.4,pill:true});}

// 2 · cuanto más nos lavamos…
{const B=Beat(C('lavamos'),C('funcionado')); const p=Panel(B,'s_shower',{from:[.5,.4,1.05],to:[.6,.3,1.18]});
 p.draw=(c,t)=>{water(c,t,{x0:570,y0:85,x1:470,y1:430,spread:260,n:34}); steam(c,t,{x:120,y:430}); steam(c,t,{x:700,y:440,w:150,n:5});};
 Cap(B,'¿Más lavado = <span class="hl">más salud</span>?',{cx:960,cy:965,size:76,t0:B.a+0.3,pill:true});}

// 3 · durante años funcionó
{const B=Beat(C('funcionado'),C('responder')-0.4); Cut(B,'calendar',{cx:760,cy:900,h:600,amp:3,tilt:.6});
 const s=Svg(B); const gx=[556,637,718,799,880,961], gy=[602,673,744];
 for(let i=0;i<18;i++) Draw(B,s,tick(gx[i%6]+8,gy[Math.floor(i/6)]+4,0.75),{t0:B.a+0.2+i*0.07,dur:0.15,stroke:'#22a35a',w:10});
 Cap(B,'Durante años… <span class="hl">funcionó</span>',{cx:1500,cy:500,size:74,t0:B.a+0.3});}

// 4 · después de los 60 la piel responde distinto
{const B=Beat(C('responder')-0.4,C('imagina1'),{enter:'up'}); Cut(B,'tight_arm',{cx:620,cy:1010,h:860,amp:3,tilt:.5,shake:1.2});
 Cap(B,'Después de los 60',{cx:1330,cy:400,size:80,t0:B.a+0.1,color:'#2f6fd6'});
 Cap(B,'la piel <span class="hl">responde distinto</span>',{cx:1330,cy:540,size:84,t0:B.a+0.6});}

// 5 · al secarte, piernas tirantes
{const B=Beat(C('imagina1'),C('picor1')); const p=Panel(B,'s_dry_leg',{from:[.4,.4,1.0],to:[.7,.7,1.2]});
 p.draw=(c,t)=>{if(t>B.a+3.4)sparks(c,t,{x:650,y:300,s:1.1});};
 Cap(B,'Al secarte: <span class="hl">piernas tirantes</span>',{cx:960,cy:965,size:74,t0:B.a+3.0,pill:true});}

// 6 · un rato después, el picor
{const B=Beat(C('picor1'),C('crema1'),{enter:'up'}); Cut(B,'scratch_shin',{cx:760,cy:1000,h:820,amp:3,tilt:.6,shake:2});
 Canvas(B,(c,t)=>{sparks(c,t,{x:1010,y:620,s:1.8}); sparks(c,t+0.4,{x:1060,y:760,s:1.4});});
 Cap(B,'Un rato después…',{cx:1430,cy:420,size:70,t0:B.a,color:'#6a6f86'}); Cap(B,'<span class="hl">picor</span>',{cx:1430,cy:560,size:130,t0:B.a+0.5});}

// 7 · crema… y al día siguiente lo mismo (loop)
{const B=Beat(C('crema1'),C('atribuirlo')); Cut(B,'cream_jar_hold',{cx:620,cy:1010,h:860,amp:4,tilt:1});
 const s=Svg(B); const lp=Draw(B,s,'M1250 330 C1500 250 1640 450 1520 600 C1420 720 1180 690 1150 540 M1125 585 L1150 540 L1195 565',{t0:C('siguiente'),dur:0.7,stroke:'#e23b2e',w:10});
 B.fx.push(t=>{lp.style.transformOrigin='1380px 480px'; lp.style.transform=`rotate(${t>C('siguiente')+0.7?(t-C('siguiente')-0.7)*40:0}deg)`;});
 Cap(B,'Te pones crema…',{cx:1380,cy:220,size:70,t0:B.a+0.2}); Cap(B,'…y al día siguiente, <span class="hl">igual</span>',{cx:1380,cy:820,size:70,t0:C('siguiente')+0.3});}

// 8 · ¿la edad? → observa cómo te duchas
{const B=Beat(C('atribuirlo'),C('grasa')-1.2); const p=Panel(B,'s_mirror',{from:[.5,.5,1.0],to:[.35,.65,1.2]});
 p.draw=(c,t)=>{sparks(c,t,{x:345,y:300,s:1.0});};
 Cap(B,'No es solo la edad: <span class="hl">observa cómo te duchas</span>',{cx:960,cy:965,size:66,t0:C('observar'),pill:true});
 Cap(B,'¿La edad?',{cx:960,cy:965,size:70,t0:B.a+0.2,pill:true,t1:C('observar')-0.3});}

// 9 · menos grasa natural, retiene peor la humedad
{const B=Beat(C('grasa')-1.2,C('capa'),{enter:'zoom'}); Cut(B,'skin_block',{cx:700,cy:900,h:640,amp:3,tilt:.4});
 Canvas(B,(c,t)=>{ // natural oil (yellow drops) fading from the surface, then water leaving
   const f=1-prog(t,C('grasa'),C('grasa')+1.6);
   for(let i=0;i<9;i++){c.globalAlpha=f; drop(c,470+i*55+Math.sin(t*2+i)*4,330+Math.sin(i*1.7)*10,0.8,'#f7c948','#c99a1c');} c.globalAlpha=1;
   drops(c,t,{x:500,y:200,w:400,h:300,n:12,t0:C('retener')-0.2,speed:0.5});});
 Cap(B,'Menos <span class="hl">grasa natural</span>',{cx:1400,cy:420,size:84,t0:C('grasa')});
 Cap(B,'Retiene <span class="hl">menos agua</span>',{cx:1400,cy:580,size:84,t0:C('retener')});
 Src(B,'Fuente: NIA · AAD (Academia Americana de Dermatología)');}

// 10 · capa protectora más delicada
{const B=Beat(C('capa'),C('caliente1')-0.3); Cut(B,'skin_block',{cx:700,cy:900,h:640,amp:3,tilt:.4});
 const s=Svg(B); const sh=Draw(B,s,'M490 345 C560 315 640 360 720 330 C800 305 860 345 920 325',{t0:B.a+0.4,dur:0.7,stroke:'#22a35a',w:16});
 B.fx.push(t=>{const k=prog(t,C('delicada')-0.3,C('delicada')+0.6); sh.setAttribute('stroke',k>0.5?'#e23b2e':'#22a35a'); sh.setAttribute('stroke-width',16-10*k); sh.style.strokeDasharray=k>0.5?'18 22':sh.getTotalLength();});
 Cap(B,'Capa <span class="hl">protectora</span>',{cx:1400,cy:420,size:84,t0:B.a+0.5});
 Cap(B,'más <span class="red">delicada</span>',{cx:1400,cy:580,size:84,t0:C('delicada')});}

// 11 · agua muy caliente, mucho gel, esponja áspera → más sequedad
{const B=Beat(C('caliente1')-0.3,C('sorpresa1'),{enter:'up'});
 const items=[['thermo','caliente1','Agua muy caliente'],['gel','gel1','Mucho gel'],['sponge','esponja1','Esponja áspera']];
 const s=Svg(B);
 items.forEach(([n,k,txt],i)=>{const x=420+i*540; Cut(B,n,{cx:x,cy:720,h:n==='thermo'?470:420,t0:C(k),amp:5,phase:i});
   Cap(B,txt,{cx:x,cy:810,size:58,t0:C(k)+0.1}); Draw(B,s,cross(x+150,370,1.2),{t0:C('sequedad1')+i*0.2,dur:0.3,stroke:'#e23b2e',w:13});});
 Canvas(B,(c,t)=>{const x=420; if(t>C('caliente1'))steam(c,t,{x,y:330,w:160,n:6,r:22,rise:120});});
 Cap(B,'= <span class="hl">más sequedad</span>',{cx:960,cy:960,size:84,t0:C('sequedad1')+0.5});}

// 12 · primera sorpresa
{const B=Beat(C('sorpresa1'),C('malo')-0.6,{enter:'zoom'});
 Canvas(B,(c,t)=>rays(c,t,{x:960,y:500,r0:260,r1:330,lw:10}));
 Cap(B,'¡Primera <span class="hl">sorpresa</span>!',{cx:960,cy:500,size:140,t0:B.a+0.1});}

// 13 · no es malo… pero tampoco obligatorio
{const B=Beat(C('malo')-0.6,C('apenas')); Cut(B,'calendar',{cx:620,cy:900,h:600,amp:3,tilt:.6});
 const s=Svg(B); Draw(B,s,tick(930,380,1.4),{t0:C('malo'),dur:0.3,stroke:'#22a35a',w:15});
 Cap(B,'Ducharte a diario <span class="hl">no es malo</span>',{cx:1490,cy:380,size:68,t0:C('malo')});
 Cap(B,'…pero tampoco es <span class="hl">obligatorio</span>',{cx:1400,cy:600,size:76,t0:C('obligacion')});
 Draw(B,s,scribble(1460,600,420,90),{t0:C('obligacion')+0.7,dur:0.6,stroke:'#2f6fd6',w:7});}

// 14 · poca actividad vs más actividad (split)
{const B=Beat(C('apenas'),C('adaptarse'));
 Panel(B,'s_tea',{x:500,y:470,w:880,from:[.5,.5,1],to:[.45,.45,1.1]}).draw=(c,t)=>steam(c,t,{x:345,y:110,w:30,n:3,r:8,rise:60});
 const g=Panel(B,'s_garden',{x:1420,y:470,w:880,from:[.5,.5,1],to:[.6,.45,1.12],t0:C('caminar')});
 g.draw=(c,t)=>{c.save();c.translate(600,250);c.rotate(Math.sin(t*1.6)*0.02);c.restore(); drops(c,t,{x:360,y:60,w:60,h:80,n:3,t0:C('caminar'),s:0.5,speed:0.7});};
 Cap(B,'Apenas suda,<br>pasa el día en casa',{cx:500,cy:900,size:58,t0:B.a+0.4,pill:true});
 Cap(B,'Camina, cuida el jardín,<br><span class="hl">suda más</span>',{cx:1420,cy:900,size:58,t0:C('jardin'),pill:true});
 Cut(B,'antonio_walk',{cx:1760,cy:1060,h:300,t0:C('caminar'),dir:'r',amp:6,period:0.7,tilt:2});}

// 15 · adaptarse, no norma rígida
{const B=Beat(C('adaptarse'),C('nosignifica'),{enter:'zoom'});
 const s=Svg(B);
 Cap(B,'La higiene se <span class="hl">adapta</span>',{cx:960,cy:300,size:96,t0:B.a+0.2});
 Cap(B,'a tu cuerpo y a tu actividad',{cx:960,cy:440,size:66,t0:B.a+1.4,color:'#2f6fd6'});
 Draw(B,s,tick(700,640,1.3),{t0:B.a+1.0,dur:0.3,stroke:'#22a35a',w:15});
 Cap(B,'Norma rígida',{cx:1000,cy:720,size:84,t0:C('rigida'),color:'#6a6f86'});
 Draw(B,s,'M780 720 L1220 720',{t0:C('rigida')+0.5,dur:0.4,stroke:'#e23b2e',w:12});
 Draw(B,s,cross(700,720,1),{t0:C('rigida')+0.3,dur:0.3,stroke:'#e23b2e',w:13});}

// 16 · no significa dejar de lavarse
{const B=Beat(C('nosignifica'),C('manos')-0.4); const p=Panel(B,'s_shower_soft',{from:[.5,.45,1.0],to:[.4,.5,1.12]});
 p.draw=(c,t)=>{water(c,t,{x0:600,y0:90,x1:520,y1:420,spread:220,n:28}); steam(c,t,{x:120,y:420});};
 Cap(B,'No significa <span class="hl">dejar de lavarse</span>',{cx:960,cy:965,size:74,t0:B.a+0.3,pill:true});}

// 17 · zonas de atención diaria (body map)
{const B=Beat(C('manos')-0.4,C('diferencia'),{enter:'zoom'}); Cut(B,'body',{...BODY,amp:2,tilt:.2});
 const s=Svg(B);
 const Z=[['manos','Manos',[[122,262],[312,262]],[1250,330]],['axilas','Axilas',[[166,126],[268,126]],[1250,470]],
          ['intima','Zona íntima',[[217,288]],[1250,610]],['pliegues','Pliegues de la piel',[[217,96],[140,205],[296,205]],[1250,750]]];
 Z.forEach(([k,txt,pts,[lx,ly]],i)=>{
   pts.forEach(([x,y])=>{const [X,Y]=bp(x,y); const c=sv('circle',{cx:X,cy:Y,r:22,fill:'#f95c00',stroke:'#fff','stroke-width':5},s);
     B.fx.push(t=>{const p=prog(t,C(k),C(k)+0.3); c.style.opacity=p>0?1:0; c.setAttribute('r',p<=0?0:(16+6*Math.sin(t*5))*back(p));});});
   Draw(B,s,tick(lx-20,ly,0.8),{t0:C(k)+0.2,dur:0.25,stroke:'#22a35a',w:11});
   Cap(B,txt,{cx:lx+40+txt.length*14,cy:ly,size:64,t0:C(k)});});
 Cap(B,'Atención <span class="hl">diaria</span>',{cx:1450,cy:150,size:80,t0:B.a+0.3});}

// 18 · no siempre ducha completa con jabón de la cabeza a los pies
{const B=Beat(C('diferencia'),C('detalle')); Cut(B,'body',{...BODY,amp:2,tilt:.2});
 Canvas(B,(c,t)=>{const [x0,y0]=bp(110,20); foam(c,t,{x:x0,y:y0,w:220*bs,h:420*bs,n:60,t0:C('cabeza')-1.2,grow:1.4});});
 const s=Svg(B); Draw(B,s,cross(bp(217,0)[0],620,4),{t0:C('cabeza')+0.8,dur:0.5,stroke:'#e23b2e',w:16});
 Cap(B,'Buena higiene',{cx:1450,cy:380,size:84,t0:B.a+0.3});
 Cap(B,'≠ siempre jabón',{cx:1450,cy:520,size:84,t0:B.a+1.6});
 Cap(B,'<span class="hl">de la cabeza a los pies</span>',{cx:1450,cy:660,size:72,t0:C('cabeza')});}

// 19 · si disfrutas y tu piel está bien → sigue
{const B=Beat(C('detalle'),C('breves')); const p=Panel(B,'s_tea',{from:[.4,.4,1.0],to:[.35,.3,1.12]});
 p.draw=(c,t)=>steam(c,t,{x:345,y:110,w:30,n:3,r:8,rise:60});
 Cap(B,'¿Te gusta a diario y tu piel está bien? <span class="hl">Sigue</span>',{cx:960,cy:965,size:60,t0:C('disfrutas')+0.5,pill:true});
 const s=Svg(B); Draw(B,s,tick(1700,200,2),{t0:C('disfrutas')+2.5,dur:0.4,stroke:'#22a35a',w:18});}

// 20 · checklist: breve, templada, suave, crema
{const B=Beat(C('breves'),C('forma'),{enter:'zoom'});
 Card(B,{cx:1180,cy:540,w:1080,h:760,t0:B.a});
 Cap(B,'Ducha <span class="hl">amable</span>',{cx:1180,cy:230,size:84,t0:B.a+0.2});
 const s=Svg(B);
 const rows=[['breves','Ducha breve',null],['templada1','Agua templada','thermo'],['suaves1','Limpiador suave','gel'],['hidratante1','Crema después','cream_jar']];
 rows.forEach(([k,txt,ic],i)=>{const y=380+i*140;
   Draw(B,s,'M760 '+(y-35)+' h70 v70 h-70 Z',{t0:B.a+0.3+i*0.1,dur:0.3,stroke:'#3a3c52',w:5});
   Draw(B,s,tick(800,y,0.9),{t0:C(k),dur:0.3,stroke:'#22a35a',w:12});
   if(ic)Cut(B,ic,{cx:920,cy:y+60,h:120,t0:C(k),amp:3,phase:i}); else clockIcon(B,s,{cx:920,cy:y,r:48,t0:C(k)});
   Cap(B,txt,{cx:1010+txt.length*17,cy:y,size:66,t0:C(k)});});
 Cut(B,'cream_jar_hold',{cx:330,cy:1010,h:780,t0:B.a+0.4,amp:4,tilt:1});}

// 21 · cambia la forma, no la frecuencia
{const B=Beat(C('forma'),C('calendario')-0.2); Cut(B,'tap',{cx:520,cy:880,h:560,amp:4});
 const knob=Svg(B);
 Cap(B,'Cambia <span class="hl">la forma</span>',{cx:1300,cy:420,size:100,t0:B.a+0.3});
 Cap(B,'no siempre la frecuencia',{cx:1300,cy:580,size:72,t0:B.a+1.6,color:'#6a6f86'});
 Canvas(B,(c,t)=>{water(c,t,{x0:665,y0:560,x1:665,y1:900,spread:30,n:14});});}

// 22 · antes de contar en el calendario, una pregunta
{const B=Beat(C('calendario')-0.2,C('sesiente')-0.2); Cut(B,'calendar',{cx:620,cy:900,h:600,amp:3,tilt:.6});
 const s=Svg(B); Draw(B,s,cross(640,560,3),{t0:B.a+1.2,dur:0.5,stroke:'#e23b2e',w:14});
 Cap(B,'Antes de contar duchas…',{cx:1400,cy:400,size:76,t0:B.a+0.2});
 Cap(B,'<span class="hl">hazte una pregunta</span>',{cx:1400,cy:560,size:84,t0:B.a+2.3});}

// 23 · ¿cómo se siente mi piel?
{const B=Beat(C('sesiente')-0.2,C('aparece'),{enter:'up'}); Cut(B,'think',{cx:560,cy:1010,h:880,amp:4,tilt:1});
 Cap(B,'¿Cómo se siente <span class="hl">mi piel</span>',{cx:1300,cy:420,size:88,t0:B.a+0.2});
 Cap(B,'al salir del baño?',{cx:1300,cy:560,size:88,t0:B.a+1.2});}

// 24 · señales: tirantez · descamación · picor → revisa la rutina
{const B=Beat(C('aparece'),C('persisten'));
 const T=[['tight_arm','Tirantez','aparece'],['dry_circle','Descamación','descamacion'],['scratch_shin','Picor','picorf']];
 T.forEach(([n,txt,k],i)=>{const x=420+i*540; Card(B,{cx:x,cy:500,w:440,h:560,t0:C(k),border:'#e23b2e'});
   Cut(B,n,{cx:x,cy:720,h:n==='dry_circle'?360:450,t0:C(k)+0.1,amp:3,phase:i}); Cap(B,txt,{cx:x,cy:830,size:60,t0:C(k)+0.15});});
 Cap(B,'→ <span class="hl">revisa tu rutina</span>',{cx:960,cy:970,size:80,t0:C('revisar')});}

// 25 · persisten / heridas → profesional sanitario (hold)
{const B=Beat(C('persisten'),C('llegamos')); const p=Panel(B,'s_nurse',{x:720,y:520,w:1180,from:[.5,.5,1],to:[.55,.6,1.1]});
 Card(B,{cx:1560,cy:520,w:560,h:560,t0:B.a+0.3,border:'#f7ad36',bg:'#fffaf0'});
 Cap(B,'⚠',{cx:1560,cy:330,size:110,t0:B.a+0.4,color:'#f7ad36'});
 Cap(B,'¿Persiste?',{cx:1560,cy:450,size:66,t0:B.a+0.6}); Cap(B,'¿Heridas?',{cx:1560,cy:540,size:66,t0:B.a+1.2});
 Cap(B,'→ <span class="hl">profesional</span>',{cx:1560,cy:660,size:66,t0:C('profesional')}); Cap(B,'sanitario',{cx:1560,cy:740,size:56,t0:C('profesional')+0.4});}

// 26 · ¿cuántas duchas a la semana bastan?
{const B=Beat(C('llegamos'),C('cotidiana')-0.2,{enter:'zoom'}); Cut(B,'calendar',{cx:960,cy:860,h:520,amp:3,tilt:.6});
 Cap(B,'La gran pregunta:',{cx:960,cy:150,size:66,t0:B.a+0.2,color:'#6a6f86'});
 Cap(B,'¿Cuántas duchas <span class="hl">a la semana</span>?',{cx:960,cy:270,size:86,t0:C('cuantas2')-0.6});
 ['2','3','7'].forEach((n,i)=>Num(B,n+'?',{cx:1380+i*170,cy:640,r:66,t0:C('cuantas2')+0.3+i*0.3}));}

// 27 · mira tu vida cotidiana, no reglas ajenas  → teaser Verdad 2
{const B=Beat(C('cotidiana')-0.2,C('verdad2'),{exit:'fade'});
 Panel(B,'s_tea',{x:520,y:440,w:820,from:[.5,.5,1],to:[.5,.5,1.06]}).draw=(c,t)=>steam(c,t,{x:345,y:110,w:30,n:3,r:8,rise:60});
 Panel(B,'s_garden',{x:1400,y:440,w:820,from:[.5,.5,1],to:[.5,.5,1.06],t0:B.a+0.4});
 Cap(B,'Mira <span class="hl">tu vida diaria</span>',{cx:960,cy:860,size:84,t0:B.a+0.3});
 Cap(B,'no reglas ajenas',{cx:960,cy:980,size:62,t0:C('ajenas'),color:'#6a6f86'});}
</script></body></html>
