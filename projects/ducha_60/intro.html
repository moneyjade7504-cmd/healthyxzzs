<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="cues.js"></script><script src="common.js"></script>
<script>
window.START=0; window.END=C('v1'); window.DURATION=window.END;
const PW=1560;

// 1 · cold open: Carmen under the shower
{const B=Beat(0,C('todos'),{enter:'none'}); const p=Panel(B,'s_shower',{y:540,w:PW,from:[.55,.4,1.0],to:[.45,.35,1.12]});
 p.draw=(c,t)=>{water(c,t,{x0:570,y0:85,x1:470,y1:430,spread:260,n:34}); steam(c,t,{x:120,y:430}); steam(c,t,{x:700,y:440,w:150,n:5});};
 Cap(B,'¿Más de <span class="hl">60 años</span>?',{cx:960,cy:965,size:76,t0:0.35,pill:true});}

// 2 · "todos los días": calendar fills with 7 ticks
{const B=Beat(C('todos'),C('saber')); Cut(B,'calendar',{cx:700,cy:900,h:640,amp:3,tilt:.6});
 const s=Svg(B); const gx=[496,577,658,739,820,901], gy=[562,633];
 for(let i=0;i<7;i++) Draw(B,s,tick(gx[i%6]+8,gy[Math.floor(i/6)]+4),{t0:B.a+0.3+i*0.17,dur:0.22,stroke:'#22a35a',w:12});
 Cap(B,'Ducha <span class="hl">todos los días</span>',{cx:1420,cy:430,size:86,t0:B.a+0.15});
 Cap(B,'¿lo más saludable?',{cx:1420,cy:600,size:70,t0:C('saludable'),color:'#2f6fd6'});}

// 3 · doubt: thinking Carmen + thought cloud
{const B=Beat(C('saber'),C('costumbre'),{enter:'up'}); Cut(B,'think',{cx:700,cy:1010,h:880,amp:4,tilt:1});
 Cut(B,'shower_head',{cx:1330,cy:560,h:360,t0:B.a+0.6,amp:8,period:2.4});
 const s=Svg(B); Draw(B,s,'M1000 360 C1040 160 1300 110 1420 190 C1600 170 1650 360 1560 450 C1600 600 1380 650 1300 600 C1200 660 1040 620 1050 520 C960 500 950 400 1000 360 Z',{t0:B.a+0.3,dur:0.6,stroke:'#7a8db8',w:6});
 Draw(B,s,'M930 600 a14 14 0 1 0 1 0 M880 660 a9 9 0 1 0 1 0',{t0:B.a+0.2,dur:0.3,stroke:'#7a8db8',w:5});
 Draw(B,s,'M1560 250 q40 -60 80 0 q0 40 -40 60 v30 M1600 395 v4',{t0:B.a+1.2,dur:0.45,stroke:'#e23b2e',w:14});
 Cap(B,'Algo que <span class="hl">deberías saber</span>',{cx:1300,cy:860,size:80,t0:B.a+0.3});}

// 4 · costumbre de décadas
{const B=Beat(C('costumbre'),C('perjudicando')); const p=Panel(B,'s_dawn',{from:[.3,.5,1.0],to:[.6,.5,1.12]});
 p.draw=(c,t)=>rays(c,t,{x:215,y:128});
 Cap(B,'Una costumbre <span class="hl">de décadas</span>',{cx:960,cy:965,size:76,t0:B.a+0.4,pill:true});}

// 5 · perjudicando tu piel: skin block loses water
{const B=Beat(C('perjudicando'),C('notado'),{enter:'zoom'}); Cut(B,'skin_block',{cx:760,cy:880,h:600,amp:3,tilt:.4});
 Canvas(B,(c,t)=>drops(c,t,{x:560,y:200,w:400,h:300,n:10,t0:B.a+0.6}));
 const s=Svg(B); Draw(B,s,arrow(1010,470,1230,300,0.15),{t0:B.a+0.9,dur:0.5,stroke:'#2f6fd6',w:8});
 Cap(B,'¿Perjudica tu <span class="hl">piel</span>?',{cx:1450,cy:520,size:96,t0:B.a+1.2});
 Cap(B,'sin que te des cuenta',{cx:1450,cy:670,size:56,t0:B.a+2.1,color:'#6a6f86'});}

// 6 · piernas más secas (dry leg + zoom bubble)
{const B=Beat(C('notado'),C('pican')); const p=Panel(B,'s_dry_leg',{from:[.5,.5,1.0],to:[.75,.72,1.22]});
 p.draw=(c,t)=>{if(t>B.a+1.5)sparks(c,t,{x:570,y:270,s:1.1});};
 Cut(B,'dry_circle',{cx:1540,cy:560,h:430,t0:C('secas')-0.5,amp:5,tilt:.8});
 const s=Svg(B); Draw(B,s,arrow(1330,470,1180,630,-0.1),{t0:C('secas')-0.2,dur:0.45,stroke:'#e23b2e',w:10});
 Cap(B,'Piernas <span class="hl">más secas</span>',{cx:820,cy:965,size:76,t0:C('secas')-1.1,pill:true});}

// 7 · picor en los brazos
{const B=Beat(C('pican'),C('tirantez')+0.6); const p=Panel(B,'s_mirror',{from:[.4,.6,1.05],to:[.3,.7,1.25]});
 p.draw=(c,t)=>{sparks(c,t,{x:340,y:300,s:1.1}); sparks(c,t+0.3,{x:365,y:385,s:.9});};
 Cap(B,'Te <span class="hl">pican</span> los brazos',{cx:960,cy:965,size:76,t0:B.a+0.2,pill:true});}

// 8 · tirantez
{const B=Beat(C('tirantez')+0.6,C('edad0'),{enter:'up'}); Cut(B,'tight_arm',{cx:760,cy:1010,h:860,amp:3,tilt:.5,shake:2.2});
 const s=Svg(B); Draw(B,s,scribble(870,470,120,95),{t0:B.a+0.4,dur:0.55,stroke:'#e23b2e',w:8});
 Draw(B,s,'M995 440 l60 -20 M1000 480 l70 0 M995 520 l60 20',{t0:B.a+0.7,dur:0.3,stroke:'#e23b2e',w:7});
 Cap(B,'<span class="hl">Tirantez</span>',{cx:1400,cy:470,size:120,t0:B.a+0.3});
 Cap(B,'que antes no tenías',{cx:1400,cy:620,size:60,t0:B.a+0.9,color:'#6a6f86'});}

// 9 · ¿cosa de la edad?  (hourglass)
{const B=Beat(C('edad0'),C('problema')); Cut(B,'scratch_shin',{cx:650,cy:990,h:800,amp:3,tilt:.6,shake:1.4});
 const s=Svg(B), hx=1430, hy=330;
 Draw(B,s,`M${hx-90} ${hy} h180 M${hx-90} ${hy+300} h180 M${hx-70} ${hy} C${hx-70} ${hy+110} ${hx-8} ${hy+130} ${hx-8} ${hy+150} C${hx-8} ${hy+170} ${hx-70} ${hy+190} ${hx-70} ${hy+300} M${hx+70} ${hy} C${hx+70} ${hy+110} ${hx+8} ${hy+130} ${hx+8} ${hy+150} C${hx+8} ${hy+170} ${hx+70} ${hy+190} ${hx+70} ${hy+300}`,{t0:B.a+0.35,dur:0.7,stroke:'#3a3c52',w:8});
 const top=sv('path',{fill:'#f7ad36'},s), bot=sv('path',{fill:'#f7ad36'},s), fall=sv('line',{x1:hx,x2:hx,stroke:'#f7ad36','stroke-width':5},s);
 B.fx.push(t=>{const u=prog(t,B.a+0.9,B.b), on=t>B.a+0.9?1:0; top.style.opacity=bot.style.opacity=fall.style.opacity=on;
   const ht=110*(1-u)+6, hb=20+100*u;
   top.setAttribute('d',`M${hx-55+(110-ht)*0.4} ${hy+140-ht} L${hx+55-(110-ht)*0.4} ${hy+140-ht} L${hx} ${hy+145} Z`);
   bot.setAttribute('d',`M${hx-62} ${hy+292} L${hx+62} ${hy+292} L${hx} ${hy+292-hb} Z`); fall.setAttribute('y1',hy+150); fall.setAttribute('y2',hy+290-hb*0.6);});
 Cap(B,'¿Cosa de la <span class="hl">edad</span>?',{cx:1430,cy:790,size:96,t0:B.a+1.1});}

// 10 · ¿y si el problema es cómo te duchas?
{const B=Beat(C('problema'),C('cambia'),{enter:'zoom'}); Cut(B,'shower_head',{cx:700,cy:640,h:470,amp:6,period:2.6});
 Cut(B,'tap',{cx:1180,cy:700,h:400,t0:B.a+0.55,amp:4,period:3.1,phase:1});
 Canvas(B,(c,t)=>{if(t>B.a+0.35)water(c,t,{x0:620,y0:430,x1:600,y1:760,spread:300,n:30}); steam(c,t,{x:950,y:780,w:900,n:9,r:34});});
 const s=Svg(B); Draw(B,s,scribble(900,520,520,300,1.08),{t0:B.a+2.1,dur:0.8,stroke:'#e23b2e',w:10});
 Cap(B,'¿Y si el problema es <span class="hl">cómo te duchas</span>?',{cx:960,cy:930,size:78,t0:B.a+1.1,pill:true});}

// 11 · la piel cambia: Antes vs Después de los 60
{const B=Beat(C('cambia'),C('masveces'),{enter:'zoom'});
 Cut(B,'skin_block',{cx:560,cy:830,h:480,amp:2,tilt:.3});
 const right=Cut(B,'skin_block',{cx:1360,cy:830,h:480,t0:B.a+1.0,amp:2,tilt:.3,phase:1}); right.style.filter='saturate(.45) brightness(1.04)';
 Canvas(B,(c,t)=>drops(c,t,{x:1220,y:260,w:300,h:330,n:12,t0:C('humedad0')-0.3,speed:0.55}));
 Cap(B,'Antes',{cx:560,cy:250,size:80,t0:B.a+0.3,pill:true}); Cap(B,'Después de los 60',{cx:1360,cy:250,size:72,t0:B.a+1.0,pill:true});
 const s=Svg(B); Draw(B,s,arrow(850,600,1060,600,0),{t0:B.a+0.8,dur:0.4,stroke:'#e23b2e',w:12});
 Cap(B,'Retiene <span class="hl">menos humedad</span>',{cx:960,cy:960,size:72,t0:C('humedad0')});
 Src(B,'Fuente: NIA (EE. UU.) · cuidado de la piel y envejecimiento');}

// 12 · más duchas ≠ mejor cuidado
{const B=Beat(C('masveces'),C('cuantas')); Cut(B,'shower_head',{cx:520,cy:780,h:520,amp:6,period:2.6});
 Canvas(B,(c,t)=>water(c,t,{x0:450,y0:560,x1:430,y1:950,spread:260,n:28}));
 Cap(B,'Más duchas',{cx:1220,cy:380,size:100,t0:B.a+0.3});
 Cap(B,'<span class="red">≠</span>',{cx:1220,cy:530,size:150,t0:B.a+1.2});
 Cap(B,'<span class="hl">más cuidado</span>',{cx:1220,cy:690,size:100,t0:B.a+1.7});}

// 13 · ¿cuántas veces a la semana?
{const B=Beat(C('cuantas'),C('dos')); Cut(B,'calendar',{cx:960,cy:860,h:560,amp:3,tilt:.6});
 const s=Svg(B); Draw(B,s,'M1290 360 q50 -80 110 0 q0 55 -55 80 v40 M1345 560 v5',{t0:B.a+1.4,dur:0.5,stroke:'#e23b2e',w:16});
 Cap(B,'¿Cuántas veces <span class="hl">a la semana</span>?',{cx:960,cy:170,size:84,t0:B.a+0.2});}

// 14 · ¿2, 3 o 7?
{const B=Beat(C('dos'),C('sorprenderte'),{enter:'zoom'});
 Num(B,2,{cx:560,cy:470,r:140,t0:B.a}); Num(B,3,{cx:960,cy:470,r:140,t0:B.a+0.55}); Num(B,7,{cx:1360,cy:470,r:140,t0:B.a+1.2});
 Cap(B,'dos',{cx:560,cy:700,size:64,t0:B.a+0.1,color:'#6a6f86'}); Cap(B,'tres',{cx:960,cy:700,size:64,t0:B.a+0.65,color:'#6a6f86'}); Cap(B,'¿todos los días?',{cx:1360,cy:700,size:64,t0:B.a+1.3,color:'#6a6f86'});}

// 15 · no depende solo de la edad
{const B=Beat(C('sorprenderte'),C('siete'),{enter:'up'}); Cut(B,'think',{cx:600,cy:1010,h:860,amp:4,tilt:1});
 Cap(B,'La respuesta',{cx:1300,cy:380,size:80,t0:B.a+0.2}); Cap(B,'no depende <span class="hl">solo de la edad</span>',{cx:1300,cy:520,size:80,t0:B.a+1.5});}

// 16 · 7 verdades (progress row) + 3 benefits
{const B=Beat(C('siete'),C('ultima'),{enter:'zoom'});
 Cap(B,'<span class="hl">7 verdades</span> sobre la higiene',{cx:960,cy:200,size:96,t0:B.a+0.1});
 for(let i=0;i<7;i++){Num(B,i+1,{cx:330+i*210,cy:470,r:72,t0:B.a+0.6+i*0.3});}
 const s=Svg(B);
 [['proteger','Proteger tu piel'],['molestias','Menos molestias'],['comodo','Más comodidad']].forEach(([k,txt],i)=>{
   Draw(B,s,tick(300+i*570,760,1.1),{t0:C(k),dur:0.3,stroke:'#22a35a',w:13}); Cap(B,txt,{cx:540+i*570,cy:765,size:60,t0:C(k)});});}

// 17 · presta atención a la última (number 7 grows)
{const B=Beat(C('ultima'),C('suscribete0'),{enter:'none'});
 const nums=[]; for(let i=0;i<7;i++){const E=Num(B,i+1,{cx:330+i*210,cy:470,r:72,t0:B.a-1});nums.push(E);}
 B.fx.push(t=>{const p=eio(prog(t,B.a+0.3,B.a+1.2)); nums.forEach((E,i)=>{ if(i<6){E.style.opacity=1-0.65*p;}
   else{E.style.transform=`translate(-50%,-50%) scale(${1+1.1*p}) rotate(${Math.sin(t*3)*3*p}deg)`; E.style.background=p>0.5?'#f95c00':'#2f6fd6'; E.style.boxShadow=`0 6px 0 #b54300, 0 0 ${60*p}px rgba(249,92,0,.6)`;}});});
 Cap(B,'¡Atento a <span class="hl">la última</span>!',{cx:960,cy:820,size:96,t0:B.a+1.0});
 Cap(B,'tu frecuencia ideal de ducha',{cx:960,cy:950,size:60,t0:B.a+2.6,color:'#6a6f86'});}

// 18 · suscríbete
{const B=Beat(C('suscribete0'),C('empecemos')); Cut(B,'wave',{cx:430,cy:1010,h:860,amp:5,tilt:2,period:1.6});
 const pill=mk('div','pill',B.L,'▶ SUSCRÍBETE'); Object.assign(pill.style,{left:'1260px',top:'480px',fontSize:'84px',background:'#e23b2e',color:'#fff',borderColor:'#b8231a'}); Pop(B,pill,{t0:C('canal0')-0.2,rot:-2});
 const s=Svg(B); bellIcon(B,s,{cx:1640,cy:470,s:1.3,t0:C('canal0')+0.3});
 Cap(B,'consejos sencillos y <span class="hl">basados en evidencia</span>',{cx:1260,cy:300,size:52,t0:B.a+0.6});
 Cap(B,'Claves de la Longevidad',{cx:1260,cy:660,size:78,t0:C('canal0')+0.4,color:'#2f6fd6'});}

// 19 · empecemos: lo que siempre hemos creído
{const B=Beat(C('empecemos'),C('v1')); const p=Panel(B,'s_shower_soft',{from:[.5,.4,1.0],to:[.45,.35,1.1]});
 p.draw=(c,t)=>{water(c,t,{x0:590,y0:70,x1:470,y1:380,spread:220,n:28}); steam(c,t,{x:120,y:420}); steam(c,t,{x:700,y:430,w:150,n:5});};
 Cap(B,'Lo que <span class="hl">siempre hemos creído</span>…',{cx:960,cy:965,size:74,t0:B.a+0.6,pill:true});}
</script></body></html>
